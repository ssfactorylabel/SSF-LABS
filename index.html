<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SSF LABS | SSFACTORYLABEL</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&display=swap" rel="stylesheet">
    <style>
        body{
            margin:0;
            padding:0;
            background:#030712;
            color:#fff;
            font-family:'Orbitron', Arial, sans-serif;
            text-align:center;
            min-height:100vh;
            display:flex;
            flex-direction:column;
            justify-content:center;
            align-items:center;
            background-image: 
                linear-gradient(rgba(139,92,246,0.08) 1px, transparent 1px),
                linear-gradient(90deg, rgba(59,130,246,0.08) 1px, transparent 1px);
            background-size: 40px 40px;
        }
        
        .container{padding:30px 20px;max-width:700px;}
        
        h1{
            font-size:48px;
            font-weight:900;
            letter-spacing:3px;
            margin-bottom:10px;
            background: linear-gradient(90deg, #A855F7 0%, #3B82F6 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .tag{
            color:#60A5FA;
            margin-bottom:25px;
            font-size:14px;
            font-weight:700;
            letter-spacing:2px;
        }
        p{
            font-size:16px;
            margin-bottom:35px;
            line-height:1.6;
            color:#CBD5E1;
        }
        
        .btn{
            display:inline-block;
            margin:10px;
            padding:14px 28px;
            background: linear-gradient(90deg, #8B5CF6 0%, #3B82F6 100%);
            color:#fff;
            text-decoration:none;
            border-radius:12px;
            font-weight:900;
            font-size:14px;
            letter-spacing:1px;
            border:2px solid transparent;
            transition:all 0.2s;
        }
        .btn:hover{
            transform:scale(1.05);
            box-shadow:0 0 20px rgba(139,92,246,0.5);
        }
        
        footer{
            margin-top:40px;
            font-size:12px;
            color:#475569;
            font-weight:700;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>SSF LABS</h1>
        <div class="tag">AI SAFETY • MACHINE LEARNING • AUTOMATIZACIÓN</div>
        <p>Forjando herramientas tecnológicas para impulsar el talento humano.</p>
        
        <a href="https://github.com/ssfactorylabel" class="btn">GITHUB</a>
        <a href="ssfactorylabel.html" class="btn">SSFACTORYLABEL</a>
        
        <footer>EVOLUCIÓN DE SPECIAL AI 👽</footer>
    </div>
</body>
</html>
