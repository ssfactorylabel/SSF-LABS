<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SSF LABS</title>
    <style>
        body{
            background:#030712;
            color:white;
            font-family:Arial, sans-serif;
            text-align:center;
            min-height:100vh;
            display:flex;
            flex-direction:column;
            justify-content:center;
            align-items:center;
            padding:40px 20px;
            margin:0;
            background-image: 
                linear-gradient(rgba(139,92,246,0.08) 1px, transparent 1px),
                linear-gradient(90deg, rgba(59,130,246,0.08) 1px, transparent 1px);
            background-size: 40px 40px;
        }
        .logo{
            width:120px;
            height:120px;
            margin-bottom:20px;
            animation:float 3s ease-in-out infinite;
            border-radius:20px;
            object-fit:cover;
        }
        @keyframes float{
            0%, 100%{transform:translateY(0px)}
            50%{transform:translateY(-10px)}
        }
        h1{
            font-size:50px;
            font-weight:900;
            margin-bottom:10px;
            background: linear-gradient(90deg, #A855F7 0%, #3B82F6 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing:2px;
        }
        .tag{color:#60A5FA;margin-bottom:20px;font-size:14px;font-weight:700;letter-spacing:1px;}
        p{color:#CBD5E1;margin-bottom:35px;max-width:600px;line-height:1.6;}
        .btn{
            display:inline-block;
            margin:10px;
            padding:15px 30px;
            background: linear-gradient(90deg, #8B5CF6 0%, #3B82F6 100%);
            color:white;
            text-decoration:none;
            border-radius:12px;
            font-weight:800;
            transition:0.3s;
        }
        .btn:hover{transform:translateY(-3px);box-shadow:0 0 25px rgba(139,92,246,0.6);}
        footer{margin-top:40px;font-size:12px;color:#475569;font-weight:700;}
    </style>
</head>
<body>
    <!-- LOGO CON NOMBRE LARGO -->
    <img src="BeautyPlus-BG-CHANGER-1783273738276.jpg.png" alt="SSF LABS Logo" class="logo">
    
    <h1>SSF LABS</h1>
    <div class="tag">AI SAFETY • MACHINE LEARNING • AUTOMATIZACIÓN</div>
    <p>Forjando herramientas tecnológicas para impulsar el talento humano.</p>
    
    <a href="https://github.com/ssfactorylabel" class="btn">GITHUB</a>
    <a href="ssfactorylabel.html" class="btn">SSFACTORYLABEL</a>
    
    <footer>EVOLUCIÓN DE SPECIAL AI 👽</footer>
</body>
</html>
